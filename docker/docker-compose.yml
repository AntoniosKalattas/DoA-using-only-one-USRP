# Windows 10/11 (Docker Desktop + WSL2) or Linux.  See README.md for the USB step (usbipd).
#   docker compose up -d                       console only
#   docker compose --profile ngrok up -d       console + ngrok link for the phone
services:
  console:
    image: usrp-console:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: usrp-console
    restart: unless-stopped
    # B210 access: the whole USB bus, because the B210 disconnects and reconnects
    # (new device node) after UHD loads its firmware.
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - cal_presets:/app/capture_console/cal_presets     # calibrations survive restarts
      - phone_logs:/app/capture_console/phone_logs
    ports:
      - "127.0.0.1:8099:8099"     # console + radar: this PC only
      - "127.0.0.1:5080:5080"     # phone ingest: this PC only (ngrok forwards to it)
      - "5005:5005/udp"           # phone telemetry over the local Wi-Fi (UDP mode)

  ngrok:
    image: ngrok/ngrok:3
    profiles: ["ngrok"]
    restart: unless-stopped
    depends_on: [console]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}   # from .env (only needed with --profile ngrok)
    command: ["http", "console:5080", "--log", "stdout"]
    ports:
      - "127.0.0.1:4040:4040"     # http://localhost:4040 shows the public link

volumes:
  cal_presets:
  phone_logs:
