# Release pipeline: push a tag like v1.5.0 (or run it by hand from the Actions tab) and it
# builds and publishes everything people need to install the system:
#
#   UsrpBeacon.apk                 Android phone app (signed with the release key if the
#                                  ANDROID_* secrets are set, otherwise with a debug key)
#   ghcr.io/<owner>/usrp-console   Capture Console Docker image (:vX.Y.Z and :latest)
#   usrp-console-image.tar.gz      the same image as a file, for offline installs
#   usrp-console-windows.zip       Windows one-click bundle (START-HERE.bat)
#   usrp-console-src.tar.gz        source used by install.sh
#   install.sh / install.ps1       one-line setup wizards
#   SHA256SUMS
#
# File names carry no version, so .../releases/latest/download/<name> always works.
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]          # main: build + test only, nothing is published
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.5.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/UsrpBeacon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing with the release key"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set - APK is signed with a debug key (installs fine, but updates need an uninstall if the key changes)"
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace assembleRelease -PappVersionName="$VERSION" \
                 -PappVersionCode="$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # surface the real error as a (publicly readable) annotation
            msg=$(grep -E "error:|e: |What went wrong|FAILURE|Exception" -A4 "$RUNNER_TEMP/gradle.log" | head -40 | tr '\n' ' ' | cut -c1-3500)
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/UsrpBeacon.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: UsrpBeacon.apk

  console-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (ghcr needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/usrp-console" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (console answers on :8099)
        run: |
          fail() { echo "::error title=Smoke test failed::$(echo "$1" | tr '\n' ' ' | cut -c1-3500)"; exit 1; }
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -i usrp || true
          out=$(docker tag "$IMAGE:latest" usrp-console:latest 2>&1) || fail "docker tag: $out"
          out=$(docker run -d --name usrp-smoke -p 8099:8099 usrp-console:latest 2>&1) || fail "docker run: $out"
          for i in $(seq 1 30); do curl -fs localhost:8099/radar >/dev/null && break; sleep 1; done
          curl -fs localhost:8099/radar >/dev/null || fail "no answer on :8099. logs: $(docker logs usrp-smoke 2>&1 | tail -20)"
          docker rm -f usrp-smoke
      - name: Offline image file
        run: docker save usrp-console:latest | gzip -1 > usrp-console-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: usrp-console-image.tar.gz

  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source archive + Windows bundle
        run: |
          git archive --format=tar.gz --prefix=usrp-console/ -o usrp-console-src.tar.gz HEAD
          cd deploy/windows
          zip -r ../../usrp-console-windows.zip . -x "*.tar.gz" "*.apk" "source-code.zip" ".env"
          cd ../..
          cp deploy/install.sh deploy/install.ps1 .
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            usrp-console-src.tar.gz
            usrp-console-windows.zip
            install.sh
            install.ps1

  publish:
    needs: [android, console-image, bundles]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          R="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          cat > notes.md <<EOF
          ## Install

          | | |
          |---|---|
          | **Phone (Android)** | open [UsrpBeacon.apk]($R/UsrpBeacon.apk) on the phone and install it |
          | **macOS / Linux** | \`curl -fsSL $R/install.sh \| bash\` |
          | **Windows 10/11** | PowerShell: \`irm $R/install.ps1 \| iex\` (or unzip usrp-console-windows.zip and double-click START-HERE.bat) |
          | **Docker** | \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/usrp-console:${VERSION}\` |

          The radar opens at http://localhost:8099/radar.
          EOF
          sed -i 's/^          //' notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
